name: Pi Manager Smoke

on:
  pull_request:
    branches: [ "main" ]
    paths:
      - 'app/src/main/assets/terminal/vcspace-pi-manager.sh'
      - '.github/workflows/pi-manager-smoke.yml'
  workflow_dispatch:

jobs:
  smoke:
    name: Alpine Pi manager smoke (${{ matrix.arch }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: aarch64
            platform: linux/arm64
          - arch: x86_64
            platform: linux/amd64
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up QEMU
        if: matrix.arch == 'aarch64'
        uses: docker/setup-qemu-action@v3

      - name: Smoke test Pi manager in Alpine
        run: |
          docker run --rm --platform ${{ matrix.platform }} \
            -v "$PWD/app/src/main/assets/terminal/vcspace-pi-manager.sh:/usr/bin/vcspace-pi-manager:ro" \
            alpine:3.22 \
            /bin/sh -lc 'cp /usr/bin/vcspace-pi-manager /tmp/vcspace-pi-manager && chmod +x /tmp/vcspace-pi-manager && APK_REPOSITORY_BASE=https://mirrors.aliyun.com/alpine/v3.22 /tmp/vcspace-pi-manager smoke'
